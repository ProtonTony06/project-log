# Project_Log backend — configuración (C1 DD-8 + bloque security de C2 CD-7).
# Propiedades mínimas: sin WS_HEARTBEAT_SECONDS (heartbeat es C7), sin
# límites de ingesta (C5). FRONTEND_ORIGIN entra aquí desde C2 (CORS, G1):
# falta ⇒ CORS cerrado (S26). JWT_SECRET NO está en este yml: se lee con
# @Value("${JWT_SECRET}") — jamás default-izado en un fichero versionado.
server:
  port: 8080

spring:
  datasource:
    url:      ${SPRING_DATASOURCE_URL}        # jdbc:postgresql://postgres:5432/project_log
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true                             # V1 desde classpath:db/migration (DD-6)
  jpa:
    hibernate:
      ddl-auto: none                          # el esquema es de V1__init.sql; nada más lo toca

management:
  endpoints:
    web:
      exposure:
        include: health,info                  # literal TRD §6.5/§9 (R12)

projectlog:
  security:
    jwt-ttl-hours: ${JWT_TTL_HOURS:8}        # defecto 8 (TRD §6.3, S13)
    frontend-origin: ${FRONTEND_ORIGIN:}     # opcional: falta ⇒ CORS cerrado (S26)

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}