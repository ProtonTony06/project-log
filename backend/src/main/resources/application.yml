# Project_Log backend — configuración (C1 DD-8 + bloque security de C2 CD-7).
# Propiedades mínimas. Los
# límites de ingesta de C5 viven bajo projectlog.ingest (R5.3.3): sus
# defaults SON el contrato R-6 (1 MiB / 200). FRONTEND_ORIGIN entra aquí
# desde C2 (CORS, G1): falta ⇒ CORS cerrado (S26). JWT_SECRET NO está en
# este yml: se lee con @Value("${JWT_SECRET}") — jamás default-izado en un
# fichero versionado.
server:
  port: 8080

spring:
  datasource:
    url:      ${SPRING_DATASOURCE_URL}        # jdbc:postgresql://postgres:5432/project_log
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true                             # V1 desde classpath:db/migration (DD-6)
  jpa:
    hibernate:
      ddl-auto: none                          # el esquema es de V1__init.sql; nada más lo toca
  autoconfigure:
    # CD-8a/S3: SIN UserDetailsService propio — el usuario in-memory aleatorio
    # de Boot DEBE quedar inerte y su aviso "Using generated security password"
    # no debe aparecer (señal de config mal conectada). Las 3 SecurityFilterChain
    # de SecurityConfig no usan httpBasic/formLogin: el auto-config que genera
    # ese usuario sobra y se excluye explícitamente.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info                  # literal TRD §6.5/§9 (R12)

projectlog:
  security:
    jwt-ttl-hours: ${JWT_TTL_HOURS:8}        # defecto 8 (TRD §6.3, S13)
    frontend-origin: ${FRONTEND_ORIGIN:}     # opcional: falta ⇒ CORS cerrado (S26)
  ingest:                                    # C5 (R5.3.3): defaults = contrato R-6
    max-request-bytes: ${INGEST_MAX_REQUEST_BYTES:1MiB}  # D-6: String + normalizador iB→B
    max-batch-size: ${INGEST_MAX_BATCH_SIZE:200}         # batch 1…200 (Schema §3.4)

  streaming:                                 # C7 (R7.29): defaults del spec
    heartbeat-seconds: ${WS_HEARTBEAT_SECONDS:30}     # ya env (C1) — mapeo
    idle-timeout-seconds: ${WS_IDLE_TIMEOUT_SECONDS:75}    # P-4 (rango 60–90)
    send-time-limit-ms: ${WS_SEND_TIME_LIMIT_MS:2000}      # P-5 barrera 1
    buffer-size-bytes: ${WS_BUFFER_SIZE_BYTES:524288} # P-5 barrera 2 (512 KiB)

logging:
  level:
    root: ${LOGGING_LEVEL:INFO}