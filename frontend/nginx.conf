# nginx.conf — Project_Log frontend (los 5 puntos literales del TRD §6.2, R9).
# Solo enruta /api/v1/** + /ws/logs (TRD §9/ADR-5). Sin TLS (§6.2.5/ADR-23).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1) SPA fallback literal §6.2.1: refresh de navegador sin 404 (E9)
    location / {
        try_files $uri /index.html;
    }

    # 2) Proxy API literal §6.2.2 — rutas relativas, cero CORS (E8).
    #    proxy_pass SIN URI final: el prefijo /api/v1/ llega INTACTO al backend.
    location /api/v1/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) Proxy del WebSocket literal §6.2.3/ADR-18 (E5/E7): sin las cabeceras
    #    de upgrade y con el default 60s de read timeout, los sockets morirían.
    location /ws/logs {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}